[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hp-corpus"
version = "0.1.0"
description = "EN/ZH/DE parallel-corpus pipeline + UD parsing for translation mining on Harry Potter (Bremmers et al. 2022 reproduction)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pymupdf>=1.24",
    "pydantic>=2",
    "pyyaml>=6",
    "rich>=13",
    "pyconll>=3.2",
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=2.7",
]
align = [
    "sentence-transformers>=3",
    "numpy>=1.26",
]
parse = [
    "stanza>=1.5,<2",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "numpy>=1.26",
]

[project.scripts]
hp-corpus = "hp_corpus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hp_corpus"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires source PDFs and/or ML models; skipped by default",
]
