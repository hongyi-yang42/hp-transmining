# Chapter 2 page range — "悄悄消失的玻璃".
# Verified by OCR'ing candidate pages: Ch.2 opener ("第2章 悄悄消失的玻璃")
# is on p.19; Ch.3 ("第3章 猫头鹰传书") opens on p.29. So Ch.2 = pp.19-28.
chapter:
  number: 2
  start_page: 19
  end_page: 28

scan:
  dpi: 300

ocr:
  engine: paddleocr
  lang: ch
  model: PP-OCRv5

clean:
  header_patterns:
    - "哈利·波特与魔法石"
    - "HARRY POTTER"
    - "第2章 悄悄消失的玻璃"
    - "第2章悄悄消失的玻璃"
  remove_page_numbers: true
  min_confidence: 0.5
  footnote_markers: ["①", "②", "③", "④", "⑤"]
  merge_line_breaks: true
  paragraph_detection:
    indent_threshold: 2
    dialogue_markers: ['“', '”']

segment:
  lang: zh
  split_on: ['。', '！', '？', '；']
  preserve_ellipsis: true
