# Chapter 1 page range (1-indexed, inclusive)
chapter:
  number: 1
  start_page: 7
  end_page: 18

scan:
  dpi: 300

ocr:
  engine: paddleocr  # Image-only scan; needs OCR
  lang: ch
  model: PP-OCRv5

clean:
  header_patterns:
    - "哈利·波特与魔法石"
    - "第一章 大难不死的男孩"
  remove_page_numbers: true
  # PaddleOCR occasionally emits stray detections at extreme bbox positions
  # or with low confidence; the 8 garbage blocks observed in Chapter 1 all
  # scored 0.34-0.45, so 0.5 cleanly removes them without losing real text
  # (next-lowest real block is ~0.6).
  min_confidence: 0.5
  footnote_markers: ["①", "②", "③", "④", "⑤"]
  merge_line_breaks: true
  paragraph_detection:
    indent_threshold: 2
    dialogue_markers: ['“', '”']

segment:
  lang: zh
  split_on: ['。', '！', '？', '；']
  preserve_ellipsis: true
