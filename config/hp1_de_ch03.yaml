book: hp1
lang: de

# Carlsen 1998 first edition, Chapter 3. See hp1_de.yaml for source details.
pdf_path: data/raw/1998 Harry Potter und der Stein der Weisen -- 1998.pdf
total_pages: 337
has_text_layer: true

title: "Harry Potter und der Stein der Weisen"
author: "J.K. Rowling"
translator: "Klaus Fritz"
publisher: "Carlsen Verlag"
edition: "Erste Auflage 1998"
year: 1998
isbn: "978-3-551-31311-9"

# Chapter 3 page range — "Briefe von niemandem" (sentence-case in 1998).
# Ch.4 "Der Hüter der Schlüssel" opens on p.56, so Ch.3 = pp.40-55.
chapter:
  number: 3
  start_page: 40
  end_page: 55

scan:
  dpi: 300

ocr:
  engine: pymupdf
  lang: german

clean:
  header_patterns:
    - "Briefe von niemandem"
  remove_page_numbers: true
  min_confidence: 0.5
  merge_line_breaks: true
  # concat_split: false  # available; off for 1998 DE (inline wordlist over-splits)
  paragraph_detection:
    indent_threshold: 2
    dialogue_markers: ['»', '«']

segment:
  lang: de
  split_on: ['.', '!', '?']
  abbreviations: ['Mr.', 'Mrs.', 'Dr.', 'St.', 'etc.', 'Prof.', 'Nr.', 'bzw.', 'z.B.', 'd.h.', 'u.a.']
