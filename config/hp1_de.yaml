book: hp1
lang: de

# Carlsen Verlag 2013 edition (translator: Klaus Fritz).
# The PDF has an OCR text layer but it's noisy (Sffentlichte, Ti AR RY),
# so we re-OCR with PaddleOCR.
pdf_path: data/raw/hp1_de.pdf
total_pages: 340
has_text_layer: true  # present but low-quality; override via ocr.engine below

# Bibliographic metadata
title: "Harry Potter und der Stein der Weisen"
author: "J.K. Rowling"
translator: "Klaus Fritz"
publisher: "Carlsen Verlag"
edition: "September 2013"
year: 2013
isbn: "978-3-551-31311-9"

# Chapter 1 page range (1-indexed, inclusive)
# Found by scanning the text layer: page 7 = "Ein Junge überlebt" (chap 1),
# page 26 = "Ein Fenster verschwindet" (chap 2).
chapter:
  number: 1
  start_page: 7
  end_page: 25

scan:
  dpi: 300

ocr:
  engine: paddleocr
  lang: german  # PaddleOCR's German model name
  model: PP-OCRv5

clean:
  # Conservative starting point — refine after inspecting OCR output.
  header_patterns:
    - "Harry Potter"
    - "Ein Junge überlebt"
  remove_page_numbers: true
  min_confidence: 0.5  # same as ZH; drop PaddleOCR noise
  merge_line_breaks: true
  paragraph_detection:
    indent_threshold: 2
    dialogue_markers: ['»', '«']

segment:
  lang: de
  split_on: ['.', '!', '?']
  abbreviations: ['Mr.', 'Mrs.', 'Dr.', 'St.', 'etc.', 'Prof.', 'Nr.', 'bzw.', 'z.B.', 'd.h.', 'u.a.']
